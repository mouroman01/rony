name: Apply runtime icon retry

on:
  push:
    paths:
      - .github/workflows/apply-runtime-icon-retry.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-runtime-icon-retry:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Patch runtime taskbar icon application
        shell: python
        run: |
          from pathlib import Path

          path = Path('main.py')
          text = path.read_text(encoding='utf-8')
          old = '''    def _worker():
        time.sleep(1.0)
        try:
            user32 = ctypes.windll.user32
            current_pid = os.getpid()

            IMAGE_ICON = 1
            LR_LOADFROMFILE = 0x00000010
            WM_SETICON = 0x0080
            ICON_SMALL = 0
            ICON_BIG = 1

            big_icon = user32.LoadImageW(0, str(icon_path), IMAGE_ICON, 32, 32, LR_LOADFROMFILE)
            small_icon = user32.LoadImageW(0, str(icon_path), IMAGE_ICON, 16, 16, LR_LOADFROMFILE)
            if not big_icon and not small_icon:
                return

            enum_proc_type = ctypes.WINFUNCTYPE(ctypes.c_bool, ctypes.c_void_p, ctypes.c_void_p)

            def _enum_proc(hwnd, _lparam):
                pid = ctypes.c_ulong()
                user32.GetWindowThreadProcessId(hwnd, ctypes.byref(pid))
                if pid.value != current_pid or not user32.IsWindowVisible(hwnd):
                    return True

                length = user32.GetWindowTextLengthW(hwnd)
                if length <= 0:
                    return True

                buffer = ctypes.create_unicode_buffer(length + 1)
                user32.GetWindowTextW(hwnd, buffer, length + 1)
                title = buffer.value or ""
                if "R.O.N.Y" not in title and "Rony" not in title:
                    return True

                if big_icon:
                    user32.SendMessageW(hwnd, WM_SETICON, ICON_BIG, big_icon)
                if small_icon:
                    user32.SendMessageW(hwnd, WM_SETICON, ICON_SMALL, small_icon)
                return True

            user32.EnumWindows(enum_proc_type(_enum_proc), 0)
        except Exception as exc:
            print(f"[UI] Nao foi possivel aplicar icone da janela: {exc}")
'''
          new = '''    def _worker():
        try:
            user32 = ctypes.windll.user32
            current_pid = os.getpid()

            IMAGE_ICON = 1
            LR_LOADFROMFILE = 0x00000010
            WM_SETICON = 0x0080
            ICON_SMALL = 0
            ICON_BIG = 1
            GCLP_HICON = -14
            GCLP_HICONSM = -34

            set_class_long = getattr(user32, "SetClassLongPtrW", user32.SetClassLongW)
            big_icon = user32.LoadImageW(0, str(icon_path), IMAGE_ICON, 256, 256, LR_LOADFROMFILE)
            medium_icon = user32.LoadImageW(0, str(icon_path), IMAGE_ICON, 32, 32, LR_LOADFROMFILE)
            small_icon = user32.LoadImageW(0, str(icon_path), IMAGE_ICON, 16, 16, LR_LOADFROMFILE)
            if not big_icon and not medium_icon and not small_icon:
                return

            enum_proc_type = ctypes.WINFUNCTYPE(ctypes.c_bool, ctypes.c_void_p, ctypes.c_void_p)
            applied = False

            def _enum_proc(hwnd, _lparam):
                nonlocal applied
                pid = ctypes.c_ulong()
                user32.GetWindowThreadProcessId(hwnd, ctypes.byref(pid))
                if pid.value != current_pid or not user32.IsWindowVisible(hwnd):
                    return True

                length = user32.GetWindowTextLengthW(hwnd)
                if length <= 0:
                    return True

                buffer = ctypes.create_unicode_buffer(length + 1)
                user32.GetWindowTextW(hwnd, buffer, length + 1)
                title = buffer.value or ""
                if "R.O.N.Y" not in title and "Rony" not in title:
                    return True

                if big_icon:
                    user32.SendMessageW(hwnd, WM_SETICON, ICON_BIG, big_icon)
                    set_class_long(hwnd, GCLP_HICON, big_icon)
                elif medium_icon:
                    user32.SendMessageW(hwnd, WM_SETICON, ICON_BIG, medium_icon)
                    set_class_long(hwnd, GCLP_HICON, medium_icon)
                if medium_icon:
                    user32.SendMessageW(hwnd, WM_SETICON, ICON_SMALL, medium_icon)
                if small_icon:
                    user32.SendMessageW(hwnd, WM_SETICON, ICON_SMALL, small_icon)
                    set_class_long(hwnd, GCLP_HICONSM, small_icon)
                applied = True
                return True

            enum_proc = enum_proc_type(_enum_proc)
            for _ in range(30):
                user32.EnumWindows(enum_proc, 0)
                if applied:
                    return
                time.sleep(0.5)
        except Exception as exc:
            print(f"[UI] Nao foi possivel aplicar icone da janela: {exc}")
'''
          if old not in text:
              raise RuntimeError('Bloco de icone antigo nao encontrado')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')

      - name: Validate
        run: |
          py -3 -m py_compile main.py
          py -3 -m unittest tests.test_intent_router

      - name: Commit runtime icon retry
        shell: bash
        run: |
          if git diff --quiet -- main.py; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add main.py
          git commit -m "fix: apply runtime window icon reliably"
          git pull --rebase origin main
          git push origin HEAD:main
