name: Apply safe weather coordinate parsing

on:
  push:
    paths:
      - .github/workflows/apply-ha-safe-float.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-ha-safe-float:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch ha_config
        shell: pwsh
        run: |
          @'
          from pathlib import Path

          path = Path("ha_config.py")
          text = path.read_text(encoding="utf-8")

          helper = '''def _safe_float_env(value: str, default: float) -> float:
              value = (value or "").strip()
              if not value:
                  return default
              value = (
                  value.replace("âˆ’", "-")
                  .replace("−", "-")
                  .replace("–", "-")
                  .replace("—", "-")
                  .replace(",", ".")
              )
              try:
                  return float(value)
              except ValueError:
                  print(f"[RONY] Coordenada invalida no .env: {value!r}. Usando {default}.")
                  return default

          '''

          if "def _safe_float_env" not in text:
              text = text.replace("load_dotenv()\n\n", "load_dotenv()\n\n" + helper, 1)

          text = text.replace(
              "LAT_PAR_DEFAUT   = float(_LAT_ENV)  if _LAT_ENV  else -23.5505",
              "LAT_PAR_DEFAUT   = _safe_float_env(_LAT_ENV, -23.5505)",
          )
          text = text.replace(
              "LON_PAR_DEFAUT   = float(_LON_ENV)  if _LON_ENV  else -46.6333",
              "LON_PAR_DEFAUT   = _safe_float_env(_LON_ENV, -46.6333)",
          )

          path.write_text(text, encoding="utf-8", newline="\n")
          '@ | ForEach-Object { $_ -replace '^          ', '' } | Set-Content -LiteralPath patch_ha.py -Encoding UTF8
          py -3 patch_ha.py
          py -3 -m py_compile ha_config.py main.py

      - name: Commit source fix
        shell: bash
        run: |
          if git diff --quiet -- ha_config.py; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ha_config.py
          git commit -m "fix: tolerate unicode minus in weather coordinates"
          git pull --rebase origin main
          git push origin HEAD:main