name: Apply popup details code

on:
  push:
    paths:
      - .github/workflows/apply-popup-details-code.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-popup-details-code:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Patch Python files
        shell: python
        run: |
          from pathlib import Path

          main = Path('main.py')
          text = main.read_text(encoding='utf-8')
          text = text.replace('        time.sleep(1.0)\n        try:\n', '        try:\n', 1)
          text = text.replace(
              '            ICON_SMALL = 0\n            ICON_BIG = 1\n\n            big_icon = user32.LoadImageW(0, str(icon_path), IMAGE_ICON, 32, 32, LR_LOADFROMFILE)\n            small_icon = user32.LoadImageW(0, str(icon_path), IMAGE_ICON, 16, 16, LR_LOADFROMFILE)\n            if not big_icon and not small_icon:\n                return\n\n            enum_proc_type = ctypes.WINFUNCTYPE(ctypes.c_bool, ctypes.c_void_p, ctypes.c_void_p)\n\n            def _enum_proc(hwnd, _lparam):\n',
              '            ICON_SMALL = 0\n            ICON_BIG = 1\n            GCLP_HICON = -14\n            GCLP_HICONSM = -34\n\n            set_class_long = getattr(user32, "SetClassLongPtrW", user32.SetClassLongW)\n            big_icon = user32.LoadImageW(0, str(icon_path), IMAGE_ICON, 256, 256, LR_LOADFROMFILE)\n            medium_icon = user32.LoadImageW(0, str(icon_path), IMAGE_ICON, 32, 32, LR_LOADFROMFILE)\n            small_icon = user32.LoadImageW(0, str(icon_path), IMAGE_ICON, 16, 16, LR_LOADFROMFILE)\n            if not big_icon and not medium_icon and not small_icon:\n                return\n\n            enum_proc_type = ctypes.WINFUNCTYPE(ctypes.c_bool, ctypes.c_void_p, ctypes.c_void_p)\n            applied = False\n\n            def _enum_proc(hwnd, _lparam):\n                nonlocal applied\n',
              1,
          )
          text = text.replace(
              '                if big_icon:\n                    user32.SendMessageW(hwnd, WM_SETICON, ICON_BIG, big_icon)\n                if small_icon:\n                    user32.SendMessageW(hwnd, WM_SETICON, ICON_SMALL, small_icon)\n                return True\n\n            user32.EnumWindows(enum_proc_type(_enum_proc), 0)\n',
              '                if big_icon:\n                    user32.SendMessageW(hwnd, WM_SETICON, ICON_BIG, big_icon)\n                    set_class_long(hwnd, GCLP_HICON, big_icon)\n                elif medium_icon:\n                    user32.SendMessageW(hwnd, WM_SETICON, ICON_BIG, medium_icon)\n                    set_class_long(hwnd, GCLP_HICON, medium_icon)\n                if medium_icon:\n                    user32.SendMessageW(hwnd, WM_SETICON, ICON_SMALL, medium_icon)\n                if small_icon:\n                    user32.SendMessageW(hwnd, WM_SETICON, ICON_SMALL, small_icon)\n                    set_class_long(hwnd, GCLP_HICONSM, small_icon)\n                applied = True\n                return True\n\n            enum_proc = enum_proc_type(_enum_proc)\n            for _ in range(30):\n                user32.EnumWindows(enum_proc, 0)\n                if applied:\n                    return\n                time.sleep(0.5)\n',
              1,
          )
          main.write_text(text, encoding='utf-8')

          updater = Path('rony_updater.py')
          text = updater.read_text(encoding='utf-8')
          helper = '''\n\ndef _formatar_notas_update(manifesto: dict) -> str:\n    """Monta um texto curto e legivel com o que sera atualizado."""\n    notas = str(manifesto.get("notes", "")).strip()\n    mudancas = manifesto.get("changes", [])\n\n    linhas: list[str] = []\n    if isinstance(mudancas, list):\n        for item in mudancas:\n            item_txt = str(item).strip()\n            if item_txt:\n                linhas.append(item_txt)\n    elif isinstance(mudancas, str) and mudancas.strip():\n        linhas.extend(l.strip() for l in mudancas.splitlines() if l.strip())\n\n    if not linhas and notas:\n        linhas.extend(l.strip(" -") for l in notas.splitlines() if l.strip())\n\n    if linhas:\n        return "\\n".join(f"- {linha}" for linha in linhas[:8])\n\n    return "- Melhorias e correcoes internas do R.O.N.Y."\n\n\ndef _resumir_notas_update(texto: str, limite: int = 160) -> str:\n    texto = " ".join(l.strip(" -") for l in texto.splitlines() if l.strip())\n    if len(texto) <= limite:\n        return texto\n    return texto[: limite - 3].rstrip() + "..."\n'''
          if 'def _formatar_notas_update' not in text:
              marker = '\n\n# ═══════════════════════════════════════════════════════════════\n#  DOWNLOAD DO INSTALADOR'
              text = text.replace(marker, helper + marker, 1)
          text = text.replace('        obrigatoria  = bool(manifesto.get("mandatory", False))\n', '        obrigatoria  = bool(manifesto.get("mandatory", False))\n        detalhes     = _formatar_notas_update(manifesto)\n', 1)
          text = text.replace('                    f"v{versao_nova} esta pronta. {notas[:80]}",\n                    5,', '                    f"v{versao_nova} esta pronta: {_resumir_notas_update(detalhes)}",\n                    8,', 1)
          text = text.replace('                    "notas"   : notas,\n                    "mandatory": obrigatoria,', '                    "notas"   : notas,\n                    "detalhes": detalhes,\n                    "changes" : manifesto.get("changes", []),\n                    "mandatory": obrigatoria,', 1)
          text = text.replace('                    f"{notas}\\n\\n"\n                    f"Deseja atualizar agora?"', '                    f"O que sera atualizado:\\n{detalhes}\\n\\n"\n                    f"Deseja atualizar agora?"', 1)
          updater.write_text(text, encoding='utf-8')

      - name: Validate
        run: |
          py -3 -m py_compile main.py rony_updater.py
          py -3 -m unittest tests.test_intent_router

      - name: Commit Python patch
        shell: bash
        run: |
          if git diff --quiet -- main.py rony_updater.py; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add main.py rony_updater.py
          git commit -m "fix: show update details and runtime icon"
          git pull --rebase origin main
          git push origin HEAD:main
