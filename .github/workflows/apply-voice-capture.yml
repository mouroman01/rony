          -            pass
          +        rms = _audio_rms(audio)
          +        if rms < WAKE_RMS_MIN:
          +            return None
           
                   langue = get_langue()
                   lang_codes = {
          @@ -2356,6 +2376,8 @@ async def ecouter_wake_word() -> str | None:
                       None,
                       lambda: _transcrever_audio(audio, lang_code),
