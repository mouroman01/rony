name: Apply voice capture and TTS fixes

on:
  push:
    paths:
      - .github/workflows/apply-voice-capture.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-voice-capture:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply patch
        shell: bash
        run: |
          git apply <<'PATCH'
          diff --git a/main.py b/main.py
          index 999fd57..a649e93 100644
