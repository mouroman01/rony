name: Apply voice capture and TTS fixes

on:
  push:
    paths:
      - .github/workflows/apply-voice-capture.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-voice-capture:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch source
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          import re

          main = Path("main.py")
          text = main.read_text(encoding="utf-8")
          text = text.replace('OPENAI_REALTIME_VOICE = os.getenv("OPENAI_REALTIME_VOICE", "alloy")', 'OPENAI_REALTIME_VOICE = os.getenv("OPENAI_REALTIME_VOICE", "marin")')
          if 'OPENAI_TTS_MODEL = os.getenv("OPENAI_TTS_MODEL"' not in text:
              text = text.replace('OPENAI_REALTIME_VOICE = os.getenv("OPENAI_REALTIME_VOICE", "marin")', 'OPENAI_REALTIME_VOICE = os.getenv("OPENAI_REALTIME_VOICE", "marin")\nOPENAI_TTS_MODEL = os.getenv("OPENAI_TTS_MODEL", "gpt-4o-mini-tts")\nOPENAI_TTS_VOICE = os.getenv("OPENAI_TTS_VOICE", "marin")')
          if 'COMMAND_RMS_MIN' not in text:
              text = re.sub(r'(TIMEOUT_INATIVIDADE\s*=\s*45\.0[^\n]*\n)', r'\1COMMAND_RMS_MIN      = int(os.getenv("RONY_COMMAND_RMS_MIN", "650"))\nWAKE_RMS_MIN         = int(os.getenv("RONY_WAKE_RMS_MIN", "900"))\n', text, count=1)

          text = re.sub(r'_OPENAI_VOICE_MAP = \{\n(?:        .+\n)+?    \}', '''_OPENAI_VOICE_MAP = {
              "pt": OPENAI_TTS_VOICE,
              "en": OPENAI_TTS_VOICE,
              "fr": OPENAI_TTS_VOICE,
              "es": OPENAI_TTS_VOICE,
              "de": "cedar",
              "it": OPENAI_TTS_VOICE,
              "ja": "cedar",
              "zh": "cedar",
              "ru": "cedar",
              "ko": "cedar",
          }'''.replace('          ', '    '), text, count=1)
          text = text.replace('_OPENAI_VOICE_MAP.get(lingua_atual, "nova")', '_OPENAI_VOICE_MAP.get(lingua_atual, OPENAI_TTS_VOICE)')
          text = text.replace('model="tts-1-hd"', 'model=OPENAI_TTS_MODEL')

          if 'def _audio_rms(' not in text:
              helper = '''def _audio_rms(audio: sr.AudioData) -> int:
              """Retorna o volume RMS do trecho capturado para filtrar ruido ambiente."""
              try:
                  import audioop as _audioop
                  raw = audio.get_raw_data(convert_rate=16000, convert_width=2)
                  return int(_audioop.rms(raw, 2))
              except Exception:
                  return 9999


          '''.replace('          ', '')
              text = text.replace('    recognizer = sr.Recognizer()\n    return recognizer.recognize_google(audio, language=lang_code)\n\n\nasync def ecouter()', '    recognizer = sr.Recognizer()\n    return recognizer.recognize_google(audio, language=lang_code)\n\n\n' + helper + 'async def ecouter()')

          text = text.replace('recognizer.energy_threshold        = 300', 'recognizer.energy_threshold         = max(650, COMMAND_RMS_MIN)')
          text = text.replace('recognizer.dynamic_energy_threshold = True', 'recognizer.dynamic_energy_threshold = False')
          text = text.replace('recognizer.pause_threshold         = 0.8', 'recognizer.pause_threshold          = 0.7\n    recognizer.non_speaking_duration    = 0.35')
          text = text.replace('recognizer.adjust_for_ambient_noise(source, duration=0.3)', 'recognizer.adjust_for_ambient_noise(source, duration=0.25)')
          text = text.replace('None, lambda: recognizer.listen(source, timeout=8, phrase_time_limit=15)', 'None, lambda: recognizer.listen(source, timeout=6, phrase_time_limit=10)')
          text = text.replace('recognizer.energy_threshold         = 1800', 'recognizer.energy_threshold         = max(1800, WAKE_RMS_MIN)')
          text = text.replace('lambda: recognizer.listen(source, timeout=5, phrase_time_limit=5),', 'lambda: recognizer.listen(source, timeout=4, phrase_time_limit=4),')
          text = text.replace('"ligar realtime", "realtime", "escuta contínua", "escuta continua",', '"ligar realtime", "escuta contínua", "escuta continua",')
          text = text.replace('"ligar real time", "real time", "ativa real time",', '"ligar real time", "ativa real time",')
          if '[MICRO] Audio ignorado por volume baixo' not in text:
              text = text.replace('        langue = get_langue()\n        lang_codes = {', '        rms = _audio_rms(audio)\n        if rms < COMMAND_RMS_MIN:\n            print(f"[MICRO] Audio ignorado por volume baixo (rms={rms}).")\n            await send_web_state("idle")\n            return None\n\n        langue = get_langue()\n        lang_codes = {', 1)
          text = text.replace('print(f"[MICRO] Reconhecido ({langue}): {texte}")', 'if not texte or len(texte.strip()) < 2:\n            await send_web_state("idle")\n            return None\n\n        print(f"[MICRO] Reconhecido ({langue}, rms={rms}): {texte}")')
          text = re.sub(r'        # Verificação de energia antes de gastar API Groq\n        try:\n            import audioop as _audioop\n            raw = audio\.get_raw_data\(convert_rate=16000, convert_width=2\)\n            rms = _audioop\.rms\(raw, 2\)\n            if rms < 600:[^\n]*\n                return None\n        except Exception:\n            pass\n', '        # Verificação de energia antes de gastar API Groq\n        rms = _audio_rms(audio)\n        if rms < WAKE_RMS_MIN:\n            return None\n', text, count=1)
          if '[VEILLE] Transcricao candidata' not in text:
              text = text.replace('        )\n        return texte\n    except (sr.WaitTimeoutError, sr.UnknownValueError):', '        )\n        if texte:\n            print(f"[VEILLE] Transcricao candidata (rms={rms}): {texte}")\n        return texte\n    except (sr.WaitTimeoutError, sr.UnknownValueError):', 1)
          if 'Em espera, nada e executado sem a palavra de ativacao.' not in text:
              text = text.replace('                if len(t_veille) >= 2:\n                    print(f"[VEILLE] Entendu : \'{texte}\'")\n\n                # 1. Shutdown por voz mesmo em veille', '                if len(t_veille) >= 2:\n                    print(f"[VEILLE] Entendu : \'{texte}\'")\n\n                # Em espera, nada e executado sem a palavra de ativacao.\n                if not contient_wake_word(texte):\n                    continue\n\n                # 1. Shutdown por voz mesmo em veille')
          main.write_text(text, encoding="utf-8", newline="\n")

          wake = Path("wake_word.py")
          w = wake.read_text(encoding="utf-8")
          if 'import unicodedata' not in w:
              w = w.replace('import re\n', 'import re\nimport unicodedata\n')
          w = re.sub(r'def contient_wake_word\(texte: str\) -> bool:\n    """.*?"""\n    t = texte\.lower\(\)\.strip\(\)\n    # Vérification exacte\n    if t in WAKE_WORDS:\n        return True\n    # Vérification partielle \(le mot est contenu dans la phrase\)\n    for ww in WAKE_WORDS:\n        if ww in t:\n            return True\n    return False', '''def contient_wake_word(texte: str) -> bool:
              """Retourne True si le texte contient un mot de réveil."""
              t = _normaliser(texte)
              wake_words = {_normaliser(ww) for ww in WAKE_WORDS}
              if t in wake_words:
                  return True
              for ww in sorted(wake_words, key=len, reverse=True):
                  if re.search(rf"(^|\\b){re.escape(ww)}(\\b|$)", t):
                      return True
              return False'''.replace('              ', '    '), w, flags=re.S)
          if 'def _normaliser(' not in w:
              w += '''


def _normaliser(texte: str) -> str:
    texte = unicodedata.normalize("NFD", texte or "")
    texte = "".join(ch for ch in texte if unicodedata.category(ch) != "Mn")
    texte = re.sub(r"[^\\w\\s]", " ", texte.lower())
    return " ".join(texte.split())
'''
          wake.write_text(w, encoding="utf-8", newline="\n")
          '@ | ForEach-Object { $_ -replace '^          ', '' } | Set-Content -LiteralPath patch_voice.py -Encoding UTF8
          py -3 patch_voice.py
          py -3 -m py_compile main.py wake_word.py
          git diff --stat -- main.py wake_word.py

      - name: Commit source fix
        shell: bash
        run: |
          if git diff --quiet -- main.py wake_word.py; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add main.py wake_word.py
          git commit -m "fix: tighten voice capture and improve realtime voice"
          git pull --rebase origin main
          git push origin HEAD:main
