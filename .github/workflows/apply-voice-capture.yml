          index 625c003..35dc326 100644
          --- a/wake_word.py
          +++ b/wake_word.py
          @@ -5,6 +5,7 @@
           # ============================================================
           
           import re
          +import unicodedata
           
           # ── Mots de réveil acceptés (toutes langues) ─────────────────
           WAKE_WORDS: set[str] = {
          @@ -57,13 +58,12 @@ MOTS_ARRET_SIMPLES: set[str] = {
           
           def contient_wake_word(texte: str) -> bool:
               """Retourne True si le texte contient un mot de réveil."""
          -    t = texte.lower().strip()
          -    # Vérification exacte
          -    if t in WAKE_WORDS:
          +    t = _normaliser(texte)
          +    wake_words = {_normaliser(ww) for ww in WAKE_WORDS}
          +    if t in wake_words:
                   return True
          -    # Vérification partielle (le mot est contenu dans la phrase)
          -    for ww in WAKE_WORDS:
          -        if ww in t:
          +    for ww in sorted(wake_words, key=len, reverse=True):
          +        if re.search(rf"(^|\b){re.escape(ww)}(\b|$)", t):
                       return True
               return False
           
          @@ -93,3 +93,10 @@ def nettoyer_commande(texte: str) -> str:
                   pattern = re.compile(r"^" + re.escape(ww) + r"[\s,\.!?]*", re.IGNORECASE)
                   t = pattern.sub("", t).strip()
               return t if t else texte.strip()
          +
          +
          +def _normaliser(texte: str) -> str:
          +    texte = unicodedata.normalize("NFD", texte or "")
          +    texte = "".join(ch for ch in texte if unicodedata.category(ch) != "Mn")
          +    texte = re.sub(r"[^\w\s]", " ", texte.lower())
          +    return " ".join(texte.split())
          PATCH
          py -3 -m py_compile main.py wake_word.py

      - name: Commit source fix
        shell: bash
        run: |
          if git diff --quiet -- main.py wake_word.py; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add main.py wake_word.py
          git commit -m "fix: tighten voice capture and improve realtime voice"
          git pull --rebase origin main
          git push origin HEAD:main
