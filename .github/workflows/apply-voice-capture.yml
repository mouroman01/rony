          @@ -752,6 +756,16 @@ def _transcrever_audio(audio: sr.AudioData, lang_code: str) -> str:
               return recognizer.recognize_google(audio, language=lang_code)
           
           
          +def _audio_rms(audio: sr.AudioData) -> int:
          +    """Retorna o volume RMS do trecho capturado para filtrar ruido ambiente."""
          +    try:
          +        import audioop as _audioop
          +        raw = audio.get_raw_data(convert_rate=16000, convert_width=2)
          +        return int(_audioop.rms(raw, 2))
          +    except Exception:
          +        return 9999
          +
          +
