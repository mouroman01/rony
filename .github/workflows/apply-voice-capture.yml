name: Apply voice capture and TTS fixes

on:
  push:
    paths:
      - .github/workflows/apply-voice-capture.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-voice-capture:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply source patch
        shell: bash
        run: |
          python - <<'PY'
          import base64
          from pathlib import Path
          patch_b64 = ""
          Path("voice.patch").write_bytes(base64.b64decode(patch_b64))
          PY
          git apply voice.patch
          py -3 -m py_compile main.py wake_word.py

      - name: Commit source fix
        shell: bash
        run: |
          if git diff --quiet -- main.py wake_word.py; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add main.py wake_word.py
          git commit -m "fix: tighten voice capture and improve realtime voice"
          git pull --rebase origin main
          git push origin HEAD:main
