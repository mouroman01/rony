          +        if texte:
          +            print(f"[VEILLE] Transcricao candidata (rms={rms}): {texte}")
                   return texte
               except (sr.WaitTimeoutError, sr.UnknownValueError):
                   return None
          @@ -2420,6 +2442,10 @@ async def boucle_ecoute() -> None:
                   if len(t_veille) >= 2:
                       print(f"[VEILLE] Entendu : '{texte}'")
           
          +                # Em espera, nada e executado sem a palavra de ativacao.
          +                if not contient_wake_word(texte):
          +                    continue
          +
                   # 1. Shutdown por voz mesmo em veille
                   _SHUTDOWN_VEILLE = {
                       "tchau", "ate logo", "ate mais", "encerrar", "fechar rony",
          @@ -2507,12 +2533,12 @@ async def boucle_ecoute() -> None:
           _TRIGGERS_REALTIME_ON = {
