name: Apply augmented reality interface

on:
  push:
    paths:
      - .github/workflows/apply-ar-interface.yml
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHONIOENCODING: utf-8

jobs:
  apply-ar-interface:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Apply AR source changes
        shell: pwsh
        run: |
          @'
          from pathlib import Path

          def read(path):
              return Path(path).read_text(encoding="utf-8")

          def write(path, text):
              Path(path).write_text(text, encoding="utf-8", newline="\n")

          def require_replace(text, old, new, label):
              if old not in text:
                  raise SystemExit(f"Anchor not found: {label}")
              return text.replace(old, new, 1)

          # frontend/index.html
          p = "frontend/index.html"
          s = read(p)
          if 'id="ar-panel"' not in s:
              s = require_replace(s, '''  <!-- Erreur -->''', '''  <!-- Realidade aumentada -->
            <div id="ar-panel" class="ar-panel hidden">
              <video id="ar-video" playsinline muted></video>
              <canvas id="ar-overlay"></canvas>
              <div class="ar-topbar">
                <span id="ar-status">AR</span>
                <button id="ar-close" class="ar-close" type="button" title="Fechar realidade aumentada">x</button>
              </div>
            </div>

            <!-- Erreur -->''', "ar panel")
          if 'id="ar-button"' not in s:
              s = require_replace(s, '''    <button id="mobile-button"   class="ctrl-btn" title="Acesso pelo celular">celular</button>''', '''    <button id="mobile-button"   class="ctrl-btn" title="Acesso pelo celular">celular</button>
              <button id="ar-button"       class="ctrl-btn" title="Realidade aumentada">AR</button>''', "ar button")
          write(p, s)

          # frontend/src/style.css
          p = "frontend/src/style.css"
          s = read(p)
          if ".ar-panel" not in s:
              ar_css = '''
          /* Realidade aumentada */
          .ar-panel {
            position: fixed;
            inset: 0;
            z-index: 80;
            background: #020617;
            display: block;
          }
          .ar-panel.hidden {
            opacity: 0;
            pointer-events: none;
          }
          #ar-video,
          #ar-overlay {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
          }
          #ar-video {
            object-fit: contain;
            background: #020617;
          }
          #ar-overlay {
            pointer-events: none;
          }
          .ar-topbar {
            position: absolute;
            top: 18px;
            right: 18px;
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 7px 10px;
            border-radius: 8px;
            border: 1px solid rgba(6,182,212,0.35);
            background: rgba(2,6,23,0.76);
            color: rgba(255,255,255,0.9);
            font-size: 12px;
            text-transform: uppercase;
            z-index: 90;
          }
          .ar-close {
            width: 26px;
            height: 26px;
            border: 1px solid rgba(255,255,255,0.18);
            border-radius: 6px;
            background: rgba(255,255,255,0.08);
            color: rgba(255,255,255,0.92);
            cursor: pointer;
          }
          .ar-close:hover {
            border-color: rgba(248,113,113,0.8);
            color: #fca5a5;
          }

          '''
              s = require_replace(s, '''/* ── Erreur''', ar_css + '''/* ── Erreur''', "ar css")
          write(p, s)

          # frontend/src/main.ts
          p = "frontend/src/main.ts"
          s = read(p)
          if "const arBtn" not in s:
              s = require_replace(s, '''const realtimeBtn     = document.getElementById("realtime-button")   as HTMLButtonElement;''', '''const realtimeBtn     = document.getElementById("realtime-button")   as HTMLButtonElement;
          const arBtn           = document.getElementById("ar-button")         as HTMLButtonElement;
          const arPanel         = document.getElementById("ar-panel")          as HTMLDivElement;
          const arVideo         = document.getElementById("ar-video")          as HTMLVideoElement;
          const arOverlay       = document.getElementById("ar-overlay")        as HTMLCanvasElement;
          const arStatus        = document.getElementById("ar-status")         as HTMLSpanElement;
          const arClose         = document.getElementById("ar-close")          as HTMLButtonElement;''', "ar dom refs")
          if "type ArBox" not in s:
              s = require_replace(s, '''let realtimeActive = false;''', '''let realtimeActive = false;
          let arStream: MediaStream | null = null;
          let arActive = false;
          let arBusy = false;
          let arTimer: number | null = null;

          type ArBox = {
            label?: string;
            objeto?: string;
            confidence?: number | null;
            confianca?: number | null;
            x: number;
            y: number;
            largura: number;
            altura: number;
          };''', "ar state")
          if 'case "ar_mode"' not in s:
              s = require_replace(s, '''    case "pong":
                break;''', '''    case "ar_mode":
                if (data.enabled) {
                  void startArMode();
                } else {
                  stopArMode();
                }
                break;

              case "pong":
                break;''', "ar websocket handler")
          if "function resizeArOverlay" not in s:
              ar_ts = r'''
          function resizeArOverlay(): void {
            const rect = arVideo.getBoundingClientRect();
            const ratio = window.devicePixelRatio || 1;
            arOverlay.width = Math.max(1, Math.round(rect.width * ratio));
            arOverlay.height = Math.max(1, Math.round(rect.height * ratio));
            arOverlay.style.width = `${rect.width}px`;
            arOverlay.style.height = `${rect.height}px`;
          }

          function drawArBoxes(faces: ArBox[], objects: ArBox[], sourceWidth: number, sourceHeight: number): void {
            resizeArOverlay();
            const ctx = arOverlay.getContext("2d");
            if (!ctx) return;

            const ratio = window.devicePixelRatio || 1;
            ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
            ctx.clearRect(0, 0, arOverlay.width, arOverlay.height);

            const rect = arVideo.getBoundingClientRect();
            const scale = Math.min(rect.width / sourceWidth, rect.height / sourceHeight);
            const renderedW = sourceWidth * scale;
            const renderedH = sourceHeight * scale;
            const offsetX = (rect.width - renderedW) / 2;
            const offsetY = (rect.height - renderedH) / 2;

            const draw = (box: ArBox, color: string, fallback: string) => {
              const x = offsetX + box.x * scale;
              const y = offsetY + box.y * scale;
              const w = box.largura * scale;
              const h = box.altura * scale;
              const label = box.label || box.objeto || fallback;
              const score = box.confianca ?? box.confidence;
              const text = score ? `${label} ${Math.round(score * 100)}%` : label;

              ctx.strokeStyle = color;
              ctx.lineWidth = 2;
              ctx.strokeRect(x, y, w, h);

              ctx.font = "12px Inter, Segoe UI, sans-serif";
              const textW = ctx.measureText(text).width + 12;
              const textH = 22;
              ctx.fillStyle = color;
              ctx.fillRect(x, Math.max(0, y - textH), textW, textH);
              ctx.fillStyle = "#041016";
              ctx.fillText(text, x + 6, Math.max(14, y - 7));
            };

            objects.forEach((box) => draw(box, "rgba(6, 182, 212, 0.95)", "objeto"));
            faces.forEach((box) => draw(box, "rgba(34, 197, 94, 0.95)", "rosto"));
            arStatus.textContent = `${faces.length} rosto(s) · ${objects.length} objeto(s)`;
          }

          async function analyzeArFrame(): Promise<void> {
            if (!arActive || arBusy || arVideo.readyState < 2) return;
            arBusy = true;
            try {
              const sourceWidth = arVideo.videoWidth || 640;
              const sourceHeight = arVideo.videoHeight || 360;
              const targetWidth = 640;
              const targetHeight = Math.max(1, Math.round(sourceHeight * (targetWidth / sourceWidth)));
              const frameCanvas = document.createElement("canvas");
              frameCanvas.width = targetWidth;
              frameCanvas.height = targetHeight;
              const frameCtx = frameCanvas.getContext("2d");
              if (!frameCtx) return;

              frameCtx.drawImage(arVideo, 0, 0, targetWidth, targetHeight);
              const image_b64 = frameCanvas.toDataURL("image/jpeg", 0.72);
              const response = await fetch("/api/ar-frame", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ image_b64, langue: currentLang }),
              });
              const data = await response.json();
              if (!response.ok || !data.ok) {
                arStatus.textContent = data.error || "AR indisponivel";
                return;
              }
              drawArBoxes(data.faces || [], data.objects || [], targetWidth, targetHeight);
            } catch (_) {
              arStatus.textContent = "AR indisponivel";
            } finally {
              arBusy = false;
            }
          }

          async function startArMode(): Promise<void> {
            if (arActive) return;
            if (!navigator.mediaDevices?.getUserMedia) {
              errorEl.textContent = "Camera indisponivel nesta interface.";
              return;
            }

            try {
              errorEl.textContent = "";
              arStatus.textContent = "iniciando camera...";
              arPanel.classList.remove("hidden");
              arBtn.classList.add("is-realtime");
              arStream = await navigator.mediaDevices.getUserMedia({
                video: { facingMode: "environment", width: { ideal: 1280 }, height: { ideal: 720 } },
                audio: false,
              });
              arVideo.srcObject = arStream;
              await arVideo.play();
              arActive = true;
              arStatus.textContent = "analisando...";
              resizeArOverlay();
              await analyzeArFrame();
              arTimer = window.setInterval(() => { void analyzeArFrame(); }, 900);
            } catch (error) {
              stopArMode();
              errorEl.textContent = error instanceof Error && error.name === "NotAllowedError"
                ? "Permita o acesso a camera para usar a realidade aumentada."
                : "Nao consegui iniciar a realidade aumentada.";
            }
          }

          function stopArMode(): void {
            if (arTimer !== null) {
              window.clearInterval(arTimer);
              arTimer = null;
            }
            arStream?.getTracks().forEach((track) => track.stop());
            arStream = null;
            arVideo.pause();
            arVideo.srcObject = null;
            arActive = false;
            arBusy = false;
            arPanel.classList.add("hidden");
            arBtn.classList.remove("is-realtime");
            const ctx = arOverlay.getContext("2d");
            ctx?.clearRect(0, 0, arOverlay.width, arOverlay.height);
          }

          '''
              s = require_replace(s, '''// ── Événements boutons''', ar_ts + '''// ── Événements boutons''', "ar functions")
          if "arBtn.onclick" not in s:
              s = require_replace(s, '''realtimeBtn.onclick = () => {
            startRealtime();
          };
          ''', '''realtimeBtn.onclick = () => {
            startRealtime();
          };

          arBtn.onclick = () => {
            if (arActive) stopArMode();
            else void startArMode();
          };
          arClose.onclick = () => stopArMode();
          ''', "ar buttons")
          if "stopArMode();" not in s.split('if (e.key === "Escape")', 1)[1].split("}", 1)[0]:
              s = require_replace(s, '''    toggleKeyboard(false);''', '''    toggleKeyboard(false);
              stopArMode();''', "escape closes ar")
          if 'window.addEventListener("resize"' not in s:
              s = require_replace(s, '''// ── Boot ──────────────────────────────────────────────────────''', '''// ── Boot ──────────────────────────────────────────────────────
          window.addEventListener("resize", () => {
            if (arActive) resizeArOverlay();
          });''', "ar resize")
          if 'arPanel.classList.add("hidden");' not in s:
              s = require_replace(s, '''mobileModal.classList.add("hidden");''', '''mobileModal.classList.add("hidden");
          arPanel.classList.add("hidden");''', "ar boot hidden")
          write(p, s)

          # main.py
          p = "main.py"
          s = read(p)
          if "detectar_rostos" not in s.split("from specialist_module", 1)[0]:
              s = require_replace(s, '''    capturar_camera,
          )''', '''    capturar_camera, detectar_rostos, reconhecer_rostos,
          )''', "camera imports")
          if "mots_ar_on" not in s:
              ar_py = '''    mots_ar_on = {
                  "realidade aumentada", "modo realidade aumentada", "abrir realidade aumentada",
                  "abre realidade aumentada", "liga realidade aumentada", "ativar realidade aumentada",
                  "interface de realidade aumentada", "modo ar", "abrir ar", "liga ar",
                  "augmented reality", "ar mode",
              }
              mots_ar_off = {
                  "fechar realidade aumentada", "fecha realidade aumentada", "desligar realidade aumentada",
                  "sair da realidade aumentada", "parar realidade aumentada", "fechar ar",
                  "desligar ar", "stop ar", "close ar",
              }
              if any(m in t for m in mots_ar_off):
                  if CONNECTED_CLIENTS:
                      msg = json.dumps({"action": "ar_mode", "enabled": False})
                      await asyncio.gather(*[ws.send(msg) for ws in CONNECTED_CLIENTS], return_exceptions=True)
                  await parler("Fechei a realidade aumentada.")
                  return True
              if any(m in t for m in mots_ar_on):
                  if CONNECTED_CLIENTS:
                      msg = json.dumps({"action": "ar_mode", "enabled": True})
                      await asyncio.gather(*[ws.send(msg) for ws in CONNECTED_CLIENTS], return_exceptions=True)
                  await parler("Abrindo a realidade aumentada.")
                  return True

          '''
              s = require_replace(s, '''    # ── Modo Realtime''', ar_py + '''    # ── Modo Realtime''', "ar voice commands")
          if 'path != "/api/realtime-tool"' in s:
              s = s.replace('''            if path != "/api/realtime-tool":
                          self.send_error(404)
                          return

          ''', "", 1)
          if 'path == "/api/ar-frame"' not in s:
              ar_endpoint = '''                if path == "/api/ar-frame":
                              image_b64 = str(payload.get("image_b64", "")).strip()
                              if "," in image_b64:
                                  image_b64 = image_b64.split(",", 1)[1]
                              if not image_b64:
                                  self._send_json(400, {"ok": False, "error": "Frame ausente."})
                                  return

                              try:
                                  img_bytes = base64.b64decode(image_b64, validate=False)
                              except Exception:
                                  self._send_json(400, {"ok": False, "error": "Frame invalido."})
                                  return

                              lingua = str(payload.get("langue") or get_langue() or "pt")
                              rostos = detectar_rostos(img_bytes)
                              nomes = reconhecer_rostos(img_bytes) if rostos else []
                              pessoas = []
                              for idx, rosto in enumerate(rostos):
                                  nome = nomes[idx] if idx < len(nomes) else "desconhecido"
                                  pessoas.append({
                                      "label": nome if nome != "desconhecido" else "rosto",
                                      "confidence": None,
                                      **rosto,
                                  })

                              objetos = detectar_objetos(img_bytes, lingua=lingua)
                              self._send_json(200, {
                                  "ok": True,
                                  "faces": pessoas,
                                  "objects": objetos[:20],
                                  "summary": {
                                      "faces": len(pessoas),
                                      "objects": len(objetos),
                                  },
                              })
                              return

                          if path != "/api/realtime-tool":
                              self.send_error(404)
                              return

          '''
              s = require_replace(s, '''                comando = str(payload.get("comando", "")).strip()''', ar_endpoint + '''                comando = str(payload.get("comando", "")).strip()''', "ar endpoint")
          write(p, s)
          '@ | ForEach-Object { $_ -replace '^          ', '' } | Set-Content -LiteralPath apply_ar.py -Encoding UTF8
          py -3 apply_ar.py
          git diff -- main.py frontend/index.html frontend/src/main.ts frontend/src/style.css

      - name: Validate and build
        shell: pwsh
        run: |
          py -3 -m py_compile main.py camera_module.py vision_actions.py
          py -3 -m unittest tests.test_intent_router
          npm.cmd ci --prefix frontend
          npm.cmd run build --prefix frontend

      - name: Commit AR interface
        shell: bash
        run: |
          if git diff --quiet -- main.py frontend/index.html frontend/src/main.ts frontend/src/style.css frontend/dist; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add main.py frontend/index.html frontend/src/main.ts frontend/src/style.css frontend/dist
          git commit -m "feat: add augmented reality camera overlay"
          git pull --rebase origin main
          git push origin HEAD:main