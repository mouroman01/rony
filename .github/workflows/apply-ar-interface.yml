name: Apply augmented reality interface

on:
  push:
    paths:
      - .github/workflows/apply-ar-interface.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-ar-interface:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Apply patch
        shell: pwsh
        run: |
          $patch64 = ''
          [Text.Encoding]::UTF8.GetString([Convert]::FromBase64String($patch64)) | Set-Content -LiteralPath ar.patch -Encoding UTF8
          git apply ar.patch

      - name: Validate and build
        shell: pwsh
        run: |
          py -3 -m py_compile main.py camera_module.py vision_actions.py
          py -3 -m unittest tests.test_intent_router
          npm.cmd ci --prefix frontend
          npm.cmd run build --prefix frontend

      - name: Commit AR interface
        shell: bash
        run: |
          if git diff --quiet -- main.py frontend/index.html frontend/src/main.ts frontend/src/style.css frontend/dist; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add main.py frontend/index.html frontend/src/main.ts frontend/src/style.css frontend/dist
          git commit -m "feat: add augmented reality camera overlay"
          git pull --rebase origin main
          git push origin HEAD:main
